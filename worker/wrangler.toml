## NexiUP Telegram webhook gateway — Cloudflare Worker configuration.
## No secrets belong in this file. Set them with `wrangler secret put <NAME>`.

name = "nexiup-telegram-gateway"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Gives you a URL like https://nexiup-telegram-gateway.<your-subdomain>.workers.dev
workers_dev = true

# Workers Logs (Cloudflare dashboard -> your Worker -> Logs) + `wrangler tail`.
# Required for both to actually receive console.log/warn/error output.
[observability]
enabled = true
head_sampling_rate = 1

# Non-secret configuration only. APPS_SCRIPT_URL is not sensitive by itself
# (it is useless without APPS_SCRIPT_SECRET), but if you prefer to keep it
# fully private too, remove it from here and set it with
# `wrangler secret put APPS_SCRIPT_URL` instead — the code does not care
# whether a binding arrives via [vars] or as a secret.
[vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/REPLACE_WITH_YOUR_DEPLOYMENT_ID/exec"

# The following MUST be set as encrypted secrets, never written here:
#   wrangler secret put APPS_SCRIPT_SECRET
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
