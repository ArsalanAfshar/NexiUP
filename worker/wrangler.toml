# ============================================================================
#  NexiUP — Cloudflare Worker (Telegram webhook gateway)
#  NEVER put a secret in this file. It is committed to git.
#  Secrets are set with:  npx wrangler secret put <NAME>
# ============================================================================

name = "nexiup-telegram-gateway"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Publishes to https://nexiup-telegram-gateway.<your-subdomain>.workers.dev
workers_dev = true

# Enables Workers Logs (dashboard) and `npx wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# ▼▼▼ THE ONLY LINE YOU MUST EDIT ▼▼▼
# Paste your Apps Script Web App URL. It must be the production /exec URL.
APPS_SCRIPT_URL = "https://script.google.com/macros/s/REPLACE_WITH_YOUR_DEPLOYMENT_ID/exec"

# ── Required secrets (set via CLI, never written here) ──────────────────────
#   npx wrangler secret put APPS_SCRIPT_SECRET       # = Apps Script WEBHOOK_SECRET
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET  # = secret_token given to setWebhook
